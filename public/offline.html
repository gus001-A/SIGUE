<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1d7fc9">
    <title>Sin conexión · SIGUE</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: radial-gradient(circle at 30% 20%, #eaf4fc, #fff 60%); color: #0b2f55; }
        .card { max-width: 420px; text-align: center; background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 32px 28px; box-shadow: 0 24px 48px -28px rgba(11, 47, 85, .45); }
        img { width: 140px; margin-bottom: 18px; }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p { color: #64748b; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
        button { border: 0; border-radius: 12px; padding: 12px 22px; font-weight: 700; font-size: 14px; color: #fff; cursor: pointer;
            background: linear-gradient(135deg, #1d7fc9, #14a39a); box-shadow: 0 10px 20px -10px #1d7fc9; }
    </style>
</head>
<body>
    <div class="card">
        <img src="/images/logo-sigue-sm.png" alt="SIGUE">
        <h1>No hay conexión a internet</h1>
        <p>SIGUE necesita conexión para mostrar la información más reciente de la escuela. Revisa tu red e inténtalo de nuevo.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </div>
    <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
